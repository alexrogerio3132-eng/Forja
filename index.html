<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1012">
<title>Forja · Dieta e Treino</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1012; --card:#16191C; --card2:#1D2125; --linha:#272C31; --txt:#ECEFF1; --txt2:#A3ABB3; --txt3:#6E7780;
  --acento:#B8F23A; --acento-esc:#1F2A0C; --acento-borda:rgba(184,242,58,.45); --acento-fundo:rgba(184,242,58,.08);
  --p:#D9466F; --c:#B58300; --g:#2E9BD6;
  --agua:#3DC9E8; --sono:#9A7CF0; --ok:#4CC38A; --alerta:#F2A93B; --erro:#F0605D;
  --raio:16px; --toque:44px;
  --fonte:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --num:'Barlow Condensed','Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--fonte);font-size:15px;line-height:1.4}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
body.com-timer{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acento)}
h1,h2,h3{font-family:var(--num);font-weight:700;letter-spacing:.02em;margin:0}
h1{font-size:26px} h2{font-size:20px;text-transform:uppercase} h3{font-size:17px}

/* ---------- cabeçalho e abas ---------- */
.topo{position:sticky;top:0;z-index:20;background:rgba(14,16,18,.92);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linha)}
.topo .marca{font-family:var(--num);font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--acento)}
.topo .data{margin-left:auto;display:flex;align-items:center;gap:4px;min-width:0}
.topo .data button{background:var(--card2);border:1px solid var(--linha);border-radius:10px;width:40px;height:40px;font-size:18px}
.topo .data span{font-family:var(--num);font-size:16px;min-width:0;white-space:nowrap;text-align:center;padding:0 4px;cursor:pointer}
main{padding:14px 16px 20px;max-width:720px;margin:0 auto}
.abas{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:rgba(18,20,23,.97);border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom)}
.abas button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--txt3);font-size:12px;font-weight:600;min-width:0;white-space:nowrap;min-height:58px}
.abas button span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.abas button svg{width:24px;height:24px}
.abas button.on{color:var(--acento)}

/* ---------- cartões e textos ---------- */
.cartao{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:14px;margin-bottom:12px;min-width:0}
.cartao.realce{border-color:#3a4a17;background:linear-gradient(160deg,#1B2410,#16191C 60%)}
.cartao.alerta-c{border-color:#5a4318;background:linear-gradient(160deg,#2a2112,#16191C 70%)}
.cartao.foco-c{border-color:rgba(184,242,58,.35)}
.cab{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-width:0}
.cab h2,.cab h3{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cab .dir{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.sub{color:var(--txt2);font-size:13px}
.mini{color:var(--txt3);font-size:12px}
.num{font-family:var(--num);font-weight:600}
.grande{font-family:var(--num);font-weight:700;font-size:40px;line-height:1}
.grade2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grade4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.linha-flex{display:flex;align-items:center;gap:14px;min-width:0}
.sep{height:1px;background:var(--linha);margin:12px 0}
.vazio{text-align:center;color:var(--txt3);padding:18px 8px;font-size:14px}
.aviso{background:#2a2112;border:1px solid #5a4318;color:#F2C46B;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.info{background:#12222a;border:1px solid #1f4656;color:#9fd8ea;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
details summary{cursor:pointer;color:var(--txt2);font-weight:600;font-size:13px;list-style:none;min-height:28px;display:flex;align-items:center}
details summary::-webkit-details-marker{display:none}

/* ---------- botões, chips, etiquetas ---------- */
.btn{white-space:nowrap;background:var(--card2);border:1px solid var(--linha);border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--toque)}
.btn.pri{background:var(--acento);color:#10140A;border-color:var(--acento)}
.btn.peq{min-height:38px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.fant{background:none;border-color:transparent;color:var(--txt2)}
.btn.perigo{color:var(--erro);border-color:#4a2423}
.btn.bloco{width:100%}
.btn.grande-b{min-height:56px;font-size:16px}
.btn:disabled{opacity:.45}
.ic{background:var(--card2);border:1px solid var(--linha);border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.ic svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--linha);border-radius:999px;padding:8px 13px;min-height:38px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--acento-esc);border-color:var(--acento);color:var(--acento)}
.chip.riscado{text-decoration:line-through;opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.rolax{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.rolax::-webkit-scrollbar{display:none}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--txt2);border:1px solid var(--linha)}
button.tag{cursor:pointer;font-family:inherit;padding:6px 9px}
.tag.plantao{background:#2a1d10;border-color:#6b4a1a;color:var(--alerta)}
.tag.folga{background:var(--card2);color:var(--txt2)}
.tag.foco,.tag.estilo{color:var(--acento);border-color:var(--acento-borda);background:var(--acento-fundo)}
.tag.ok-t{color:var(--ok);border-color:rgba(76,195,138,.45)}
.foco-est{color:var(--acento);font-size:13px}

/* ---------- formulários ---------- */
label.campo{display:block;margin-bottom:10px;min-width:0}
label.campo>span{display:block;font-size:12px;color:var(--txt2);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=time],input[type=datetime-local],select,textarea{width:100%;background:var(--card2);border:1px solid var(--linha);border-radius:10px;padding:10px 12px;min-height:var(--toque);outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acento)}
input[type=range]{accent-color:var(--acento)}
.estrelas button{background:none;border:0;font-size:28px;color:#3a3f45;padding:0 3px;min-width:var(--toque);min-height:var(--toque)}
.estrelas button.on{color:#F2C14B}
.stepper{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stepper>button{width:56px;height:56px;border-radius:14px;background:var(--card2);border:1px solid var(--linha);font-size:28px;font-weight:600;flex-shrink:0;line-height:1}
.stepper .val{flex:1;text-align:center;min-width:0}
.stepper .val .num{font-size:30px;line-height:1.1}

/* ---------- barras, anéis, gráficos ---------- */
.barra{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.barra>i{display:block;height:100%;border-radius:99px;background:var(--acento);transition:width .3s}
.macro{margin-bottom:9px}
.macro .lin{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;gap:8px}
.macro .lin b{font-family:var(--num);font-size:15px}
.ponto{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle}
.anel{position:relative;width:132px;height:132px;flex-shrink:0}
.anel svg{transform:rotate(-90deg)}
.anel .meio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.graf{width:100%;height:auto;display:block}
.graf text{fill:var(--txt3);font-size:10px;font-family:var(--fonte)}
.tip{font-size:12px;color:var(--txt2);min-height:16px;margin-top:4px}
.zona{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.zona i{height:8px;border-radius:9px;display:block}
.tiles{gap:8px}
.tile{background:var(--card2);border:1px solid var(--linha);border-radius:12px;padding:9px 10px;min-width:0}
.tile .mini{overflow:hidden;text-overflow:ellipsis}
.tile[data-acao]{cursor:pointer}
.tile.sel{border-color:var(--acento)}

/* ---------- listas ---------- */
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--linha);min-width:0;min-height:var(--toque)}
.lista li:first-child{border-top:0}
.lista li[data-acao]{cursor:pointer}
.lista .txt{flex:1;min-width:0}
.lista .txt .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.lista .val{text-align:right;flex-shrink:0;font-family:var(--num);font-size:15px}
.lista .seta{color:var(--txt3);flex-shrink:0}
.res{padding:10px 4px;border-top:1px solid var(--linha);display:flex;gap:10px;align-items:center;min-width:0;min-height:var(--toque);cursor:pointer}
.res .txt{flex:1;min-width:0}
.res .t{font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tipo-c{border-left:3px solid var(--acento);padding-left:10px;margin:10px 0}
.tipo-c[data-es],.tipo-c[data-acao]{cursor:pointer}

/* ---------- tela Hoje ---------- */
.rapidas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.rapidas .btn{flex-direction:column;gap:2px;font-size:12px;min-height:60px;padding:8px 4px;white-space:normal;line-height:1.15;text-align:center}
.rapidas .btn b{font-family:var(--num);font-size:17px}
.tarefa{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--linha);cursor:pointer;min-width:0;min-height:52px}
.tarefa:first-child{border-top:0}
.tarefa .marca-t{width:28px;height:28px;border-radius:8px;border:2px solid #3a4148;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--txt3)}
.tarefa.ok .marca-t{background:var(--ok);border-color:var(--ok);color:#06180f}
.tarefa.andando .marca-t{border-color:var(--acento)}
.tarefa.livre .marca-t{border-style:dashed}
.tarefa .marca-t svg{width:17px;height:17px}
.tarefa .txt{flex:1;min-width:0}
.tarefa .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tarefa .seta{color:var(--txt3);font-size:20px;flex-shrink:0}

/* ---------- treino ---------- */
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--linha);min-width:0}
.ex:first-child{border-top:0}
.ex .fig{width:56px;height:56px;border-radius:10px;background:var(--card2) center/cover no-repeat;flex-shrink:0;border:1px solid var(--linha);cursor:pointer}
.ex .corpo{flex:1;min-width:0}
.ex .nome{font-weight:600;line-height:1.25}
.ex .acoes{display:grid;grid-template-columns:repeat(2,auto);gap:4px}
.ex.feito{opacity:.75;cursor:pointer;padding:8px 0}
.ex.feito .fig{width:36px;height:36px}
.prog{margin-top:3px;font-weight:600}
.prog.subir{color:var(--acento)} .prog.manter{color:var(--alerta)} .prog.reps{color:var(--agua)}
.series{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 48px;gap:6px;align-items:center;margin-top:8px}
.series .h{font-size:11px;color:var(--txt3);text-transform:uppercase;font-weight:600}
.series input{min-height:var(--toque);padding:6px 8px;text-align:center}
.series .n{font-family:var(--num);color:var(--txt2);text-align:center}
.ok-btn{height:var(--toque);border-radius:10px;border:1px solid var(--linha);background:var(--card2);display:flex;align-items:center;justify-content:center;padding:0}
.ok-btn.on{background:var(--ok);border-color:var(--ok);color:#06180f}
.ok-btn svg{width:20px;height:20px}
.timer{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:40;background:#1d2a0d;border:1px solid var(--acento);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.timer .grande{font-size:34px;color:var(--acento)}
.hiit{text-align:center}
.hiit .fase{font-family:var(--num);font-size:22px;letter-spacing:.08em;text-transform:uppercase}
.hiit .grande{font-size:84px}

/* ---------- folhas (janelas de baixo) e avisos ---------- */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--card);border:1px solid var(--linha);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:sobe .2s ease-out}
.folha .alca{width:40px;height:4px;border-radius:9px;background:var(--linha);margin:-6px auto 12px}
@keyframes sobe{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:#2b3138;color:var(--txt);padding:10px 16px;border-radius:12px;z-index:70;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw}
body.com-timer .toast{bottom:calc(176px + env(safe-area-inset-bottom))}

/* ---------- fotos de progresso ---------- */
.fotos-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lado2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fotobox{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--card2);border:1px solid var(--linha);display:block;cursor:pointer}
.fotobox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fotobox .rot{position:absolute;z-index:2;left:6px;bottom:6px;max-width:calc(100% - 12px);font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.62);padding:3px 7px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fotobox.sem::after{content:'foto não está neste aparelho';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--txt3);padding:8px}
.fotobox.slot{border:1.5px dashed var(--linha)}
.fotobox.slot.cheio{border-style:solid;border-color:var(--acento)}
.fotobox .slot-t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--txt2)}
.fotobox.vaga{cursor:default;border-style:dashed}
.fotobox .vaga-t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:12px;color:var(--txt3);line-height:1.4}
.fotobox.sel-a{outline:3px solid var(--agua);outline-offset:-3px}
.fotobox.sel-b{outline:3px solid var(--acento);outline-offset:-3px}
.fotobox.grande-f{aspect-ratio:auto;height:min(62vh,560px);cursor:default}
.fotobox.grande-f img{object-fit:contain;background:#000}
/* comparador "deslizar": a camada de cima é a foto "antes", recortada pela régua */
.desliza{cursor:ew-resize}
.desliza .camada{position:absolute;inset:0;z-index:1;clip-path:inset(0 50% 0 0)}
.desliza .linha{position:absolute;z-index:2;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.6)}

/* ---------- resumo para imprimir ---------- */
#relatorio{display:none}
.rel h1{font-size:22px} .rel h3{margin:14px 0 6px;font-size:15px}
.rel table{width:100%;border-collapse:collapse;font-size:12px}
.rel th,.rel td{border-bottom:1px solid var(--linha);padding:4px 5px;text-align:right}
.rel th:first-child,.rel td:first-child{text-align:left}
.rel .tab-rol{overflow-x:auto}
@media print{
  html,body{background:#fff!important;color:#000!important;padding:0!important}
  body>*:not(#relatorio){display:none!important}
  #relatorio{display:block!important;padding:0 6mm;--txt:#000;--txt2:#333;--txt3:#555;--linha:#bbb}
  #relatorio .mini,#relatorio .sub{color:#333}
  .rel h1,.rel h3{color:#000}
}

/* bioimpedância: grade dos segmentos */
.bio-seg{display:grid;grid-template-columns:70px repeat(4,minmax(0,1fr));gap:6px;align-items:center}
.bio-seg input[type=number]{min-width:0;padding:8px 6px;font-size:15px}
input.lido{border-color:var(--acento)!important;background:var(--acento-fundo)!important}
input.lido.conferir{border-color:var(--alerta)!important;background:rgba(242,169,59,.12)!important}

/* 1.7.3: marcar como comido e reposição */
.chk{width:32px;height:32px;min-width:32px;border-radius:9px;border:2px solid #3a4148;background:none;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--txt3);font-weight:700;flex-shrink:0}
.chk svg{width:17px;height:17px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06180f}
.chk.meio{border-color:var(--ok);color:var(--ok)}
.lista li.pendente .txt,.lista li.pendente .val{opacity:.6}
.tag.faltou{color:var(--alerta);border-color:#6b4a1a;background:#2a1d10}
.repor{background:#12222a;border:1px solid #1f4656;border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:13px}
.repor.pergunta{background:#1d1a10;border-color:#4a3d18}
.btn.jacomi{border-style:dashed}
.btn.jacomi.on{border-style:solid;border-color:var(--ok);color:var(--ok);background:rgba(76,195,138,.08)}
</style>
</head>
<body>
<header class="topo">
  <div class="marca">FORJA</div>
  <div class="data" id="navData">
    <button id="diaAnt" aria-label="Dia anterior">‹</button>
    <span id="rotuloData"></span>
    <button id="diaProx" aria-label="Próximo dia">›</button>
  </div>
</header>
<main id="main"></main>
<nav class="abas" id="abas"></nav>
<script src="alimentos.js?v=1.7.3"></script>
<script src="exercicios.js?v=1.7.3"></script>
<script src="app.js?v=1.7.3"></script>
</body>
</html>
